  <script>
    /* =====================================================================
       1. BUILT-IN FAILSAFE TOUCH & MOUSE ORBIT CONTROLLER
       ===================================================================== */
    if (typeof THREE !== 'undefined' && typeof THREE.OrbitControls === 'undefined') {
      THREE.OrbitControls = function(camera, domElement) {
        this.camera = camera;
        this.domElement = domElement || document.body;
        this.target = new THREE.Vector3(0, 3.5, 0);
        this.minDistance = 3;
        this.maxDistance = 65;
        this.maxPolarAngle = Math.PI / 2 - 0.04;
        
        let isDragging = false, prevX = 0, prevY = 0;
        let spherical = new THREE.Spherical();
        let offset = new THREE.Vector3();
        const scope = this;

        function updateSpherical() {
          offset.copy(scope.camera.position).sub(scope.target);
          spherical.setFromVector3(offset);
        }
        updateSpherical();

        function onDown(e) {
          if (e.target !== scope.domElement) return;
          isDragging = true;
          prevX = e.clientX || (e.touches && e.touches[0].clientX) || 0;
          prevY = e.clientY || (e.touches && e.touches[0].clientY) || 0;
        }

        function onMove(e) {
          if (!isDragging) return;
          const cx = e.clientX || (e.touches && e.touches[0].clientX) || 0;
          const cy = e.clientY || (e.touches && e.touches[0].clientY) || 0;
          const dx = cx - prevX, dy = cy - prevY;
          prevX = cx; prevY = cy;

          updateSpherical();
          spherical.theta -= dx * 0.005;
          spherical.phi -= dy * 0.005;
          spherical.phi = Math.max(0.1, Math.min(scope.maxPolarAngle, spherical.phi));
          spherical.radius = Math.max(scope.minDistance, Math.min(scope.maxDistance, spherical.radius));
          offset.setFromSpherical(spherical);
          scope.camera.position.copy(scope.target).add(offset);
          scope.camera.lookAt(scope.target);
        }

        function onUp() { isDragging = false; }
        function onWheel(e) {
          updateSpherical();
          spherical.radius += e.deltaY * 0.02;
          spherical.radius = Math.max(scope.minDistance, Math.min(scope.maxDistance, spherical.radius));
          offset.setFromSpherical(spherical);
          scope.camera.position.copy(scope.target).add(offset);
          scope.camera.lookAt(scope.target);
        }

        domElement.addEventListener('mousedown', onDown);
        window.addEventListener('mousemove', onMove);
        window.addEventListener('mouseup', onUp);
        domElement.addEventListener('touchstart', onDown, { passive: true });
        window.addEventListener('touchmove', onMove, { passive: true });
        window.addEventListener('touchend', onUp);
        domElement.addEventListener('wheel', onWheel, { passive: true });
        this.update = function() { scope.camera.lookAt(scope.target); };
      };
    }

    /* =====================================================================
       2. DATA ARCHITECTURE: 11 DEPARTMENTS & AGENTS
       ===================================================================== */
    const FLOOR_2_Y = 6.2;

    const DEPARTMENTS = [

    function buildAllDepartmentSigns() {
      DEPARTMENTS.forEach(dept => {
        const sign = createDepartmentSignMesh(dept.code, dept.name, dept.enName, dept.color);
        sign.position.set(dept.signPos.x, dept.signPos.y, dept.signPos.z);
        scene.add(sign);
      });
    }

    function createDepartmentSignMesh(code, name, enName, color) {
      const cv = document.createElement('canvas');
      cv.width = 512; cv.height = 160;
      const c = cv.getContext('2d');

      c.fillStyle = 'rgba(10, 15, 29, 0.94)';
      c.beginPath();
      c.moveTo(20, 10);
      c.arcTo(492, 10, 492, 150, 16);
      c.arcTo(492, 150, 20, 150, 16);
      c.arcTo(20, 150, 20, 10, 16);
      c.arcTo(20, 10, 492, 10, 16);
      c.closePath();
      c.fill();

      c.strokeStyle = color;
      c.lineWidth = 6;
      c.stroke();

      c.fillStyle = color;
      c.beginPath();
      c.arc(50, 42, 18, 0, Math.PI * 2);
      c.fill();
      c.fillStyle = '#ffffff';
      c.font = 'bold 22px Arial';
      c.textAlign = 'left';
      c.fillText(code, 80, 49);

      c.fillStyle = '#ffffff';
      c.font = 'bold 28px Arial';
      c.fillText(name, 35, 95);

      c.fillStyle = '#94a3b8';
      c.font = '14px Arial';
      c.fillText(enName, 35, 130);

      const tex = new THREE.CanvasTexture(cv);
      return new THREE.Mesh(new THREE.PlaneGeometry(3.6, 1.15), new THREE.MeshBasicMaterial({ map: tex, transparent: true }));
    }

      if (targetId === 'overview') {
        camTargetPos = new THREE.Vector3(0, 22, 36);
        lookTargetPos = new THREE.Vector3(0, 3.5, 0);
      } else if (targetId === 'assistant') {
        camTargetPos = new THREE.Vector3(ASSISTANT.pos.x, FLOOR_2_Y + 1.8, ASSISTANT.pos.z + 3.0);
        lookTargetPos = new THREE.Vector3(ASSISTANT.pos.x, FLOOR_2_Y + 1.0, ASSISTANT.pos.z);
      } else {
        const dept = DEPARTMENTS.find(d => d.id === targetId || d.code.toLowerCase().replace(' ', '') === targetId);
        if (dept) {
          camTargetPos = new THREE.Vector3(dept.camPos.x, dept.camPos.y, dept.camPos.z);
          lookTargetPos = new THREE.Vector3(dept.lookPos.x, dept.lookPos.y, dept.lookPos.z);
        } else {
          const ag = AGENTS.find(a => a.id === targetId);
          if (ag) {
            camTargetPos = new THREE.Vector3(ag.pos.x, ag.pos.y + 2.0, ag.pos.z + 3.0);
            lookTargetPos = new THREE.Vector3(ag.pos.x, ag.pos.y + 1.0, ag.pos.z);
          }
        }
      }
    }

    function toggleMeetingMode() {
      isMeetingMode = !isMeetingMode;
      const btn = document.getElementById('meeting-toggle-btn');
      if (isMeetingMode) {
        btn.innerHTML = `<i class="fa-solid fa-person-walking-arrow-loop-left"></i> 回位`;
        AGENTS.forEach(ag => {
          const m = agentMeshGroups[ag.id];
          if (m) { m.position.set(ag.meetingPos.x, ag.meetingPos.y, ag.meetingPos.z); m.rotation.y = ag.meetingRotY; }
        });
        zoomToTarget('room10');
      } else {
        btn.innerHTML = `<i class="fa-solid fa-users-viewfinder"></i> 召集开会`;
        AGENTS.forEach(ag => {
          const m = agentMeshGroups[ag.id];
          if (m) { m.position.set(ag.pos.x, ag.pos.y, ag.pos.z); m.rotation.y = ag.rotationY; }
        });
        zoomToTarget('overview');
      }
    }

    function animate() {
      requestAnimationFrame(animate);
      if (camTargetPos && lookTargetPos) {
        camera.position.lerp(camTargetPos, 0.06);
        controls.target.lerp(lookTargetPos, 0.06);
        if (camera.position.distanceTo(camTargetPos) < 0.05) {
          camTargetPos = null; lookTargetPos = null;
        }
      }
      controls.update();
      renderer.render(scene, camera);
    }

    /* =====================================================================
       4. UI DRAWERS & CONTROLLERS
       ===================================================================== */
    function toggleSidebarDrawer(show) {
      const d = document.getElementById('sidebar-drawer');
      const b = document.getElementById('drawer-backdrop');
      if (show) {
        d.classList.remove('-translate-x-full');
        b.classList.remove('hidden');
      } else {
        d.classList.add('-translate-x-full');
        b.classList.add('hidden');
      }
    }

    function toggleChatDrawer(show) {
      const d = document.getElementById('chat-drawer');
      const b = document.getElementById('drawer-backdrop');
      if (show) {
        d.classList.remove('translate-x-full');
        b.classList.remove('hidden');
      } else {
        d.classList.add('translate-x-full');
        b.classList.add('hidden');
      }
    }

    function closeAllDrawers() {
      toggleSidebarDrawer(false);
      toggleChatDrawer(false);
    }

    function openDepartmentDirectory() {
      const list = document.getElementById('dept-directory-list');
      list.innerHTML = '';
      DEPARTMENTS.forEach(dept => {
        const item = document.createElement('button');
        item.onclick = () => { zoomToTarget(dept.id); closeDepartmentDirectory(); };
        item.className = 'p-2.5 rounded-xl bg-slate-900 border border-slate-700/80 hover:border-cyan-500 text-left transition flex items-center justify-between group';
        item.innerHTML = `
          <div>
            <div class="flex items-center gap-1.5 font-bold text-white group-hover:text-cyan-300">
              <span class="px-1.5 py-0.2 rounded text-[10px] font-mono" style="background:${dept.color}25; color:${dept.color}">${dept.code}</span>
              <span>${dept.name}</span>
            </div>
            <div class="text-[10px] text-slate-400 mt-0.5">${dept.floor} · 驻守: ${dept.agent.split(' ')[0]}</div>
          </div>
          <i class="fa-solid fa-arrow-right text-[10px] text-slate-500 group-hover:text-cyan-400"></i>
        `;
        list.appendChild(item);
      });
      document.getElementById('departments-modal').classList.remove('hidden');
    }

    function closeDepartmentDirectory() {
      document.getElementById('departments-modal').classList.add('hidden');
    }

    function openProposalsModal() {
      renderProposalsList();
      document.getElementById('proposals-modal').classList.remove('hidden');
    }
    function closeProposalsModal() {
      document.getElementById('proposals-modal').classList.add('hidden');
    }

    function renderProposalsList() {
      const container = document.getElementById('proposals-list');
      container.innerHTML = '';
      PROPOSALS.forEach(prop => {
        const card = document.createElement('div');
        card.className = 'glass-card p-3 rounded-xl border border-slate-700 text-slate-200';
        card.innerHTML = `
          <div class="flex items-center justify-between pb-1.5 border-b border-slate-700">
            <span class="font-bold text-white text-xs">${prop.title}</span>
            <span class="text-[10px] text-yellow-300 font-mono">${prop.authorName}</span>
          </div>
          <p class="text-[11px] text-slate-300 py-2">${prop.summary}</p>
          <div class="flex justify-end gap-2 pt-1 border-t border-slate-700/60">
            <button onclick="alert('已批准方案！专员已开始制作并归档'); closeProposalsModal();" class="px-3 py-1 bg-emerald-600 text-white rounded-lg text-xs">批准执行</button>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function triggerSimulateAutonomousIdea() {
      alert("💡 辉师傅刚刚提出新优化：《丰田CVT起步打滑免大修油路排查指引》！已存入提案库！");
    }

    function openRecordsModal() {
      filterRecords('all');
      document.getElementById('records-modal').classList.remove('hidden');
    }
    function closeRecordsModal() {
      document.getElementById('records-modal').classList.add('hidden');
    }

    function filterRecords(cat) {
      const container = document.getElementById('records-grid');
      container.innerHTML = '';
      const list = cat === 'all' ? RECORDS : RECORDS.filter(r => r.category === cat);
      list.forEach(r => {
        const card = document.createElement('div');
        card.className = 'glass-card p-3 rounded-xl border border-slate-700 text-slate-200 flex flex-col justify-between';
        card.innerHTML = `
          <div>
            <div class="font-bold text-white text-xs pb-1 border-b border-slate-700">${r.title}</div>
            <div class="text-[10px] text-cyan-400 py-1">${r.author} · ${r.date}</div>
            <div class="text-[11px] text-slate-300 bg-slate-900/60 p-2 rounded font-mono">${r.content}</div>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function renderRoster() {
      const container = document.getElementById('dm-list-container');
      container.innerHTML = '';
      AGENTS.forEach(ag => {
        const btn = document.createElement('button');
        btn.onclick = () => { switchChannel(ag.id); zoomToTarget(ag.id); toggleSidebarDrawer(false); };
        btn.className = 'w-full text-left px-2.5 py-2 rounded-xl flex items-center justify-between text-slate-300 hover:bg-slate-800 transition';
        btn.innerHTML = `
          <div class="flex items-center gap-2 truncate">
            <span class="w-2 h-2 rounded-full" style="background:${ag.color}"></span>
            <div class="truncate">
              <div class="text-xs font-medium text-slate-200 truncate">${ag.name}</div>
              <div class="text-[10px] text-slate-400 truncate">${ag.zone.split('·')[0]}</div>
            </div>
          </div>
        `;
        container.appendChild(btn);
      });
    }

    function switchChannel(channelId) {
      currentChannel = channelId;
      const title = document.getElementById('active-chat-title');
      const badge = document.getElementById('active-chat-role-badge');
      const desc = document.getElementById('active-chat-desc');

      if (channelId === 'assistant') {
        title.innerText = ASSISTANT.name;
        badge.innerText = '最高幕僚长';
        desc.innerText = '全权统筹调度 · 过滤琐碎汇报';
      } else if (channelId === 'general') {
        title.innerText = '# 车间全员大群';
        badge.innerText = '全员在线';
        desc.innerText = '下达车间大任务、各专员按职能接单';
      } else {
        const ag = AGENTS.find(a => a.id === channelId);
        if (ag) {
          title.innerText = ag.name;
          badge.innerText = ag.zone.split('·')[0];
          desc.innerText = ag.role;
        }
      }
      renderMessages();
    }

    function renderMessages() {
      const container = document.getElementById('messages-container');
      container.innerHTML = '';
      const list = chatHistories[currentChannel] || [];
      list.forEach(msg => {
        const isUser = msg.sender === 'user';
        const d = document.createElement('div');
        d.className = `flex flex-col ${isUser ? 'items-end' : 'items-start'} space-y-1`;
        d.innerHTML = `
          <div class="text-[10px] text-slate-400">${isUser ? '我 (Boss)' : msg.name} · ${msg.time}</div>
          <div class="p-2.5 rounded-xl max-w-[90%] ${isUser ? 'bg-cyan-600 text-white' : 'glass-card text-slate-200'}">${msg.text}</div>
        `;
        container.appendChild(d);
      });
      container.scrollTop = container.scrollHeight;
    }

    function sendUserMessage() {
      const input = document.getElementById('chat-input');
      const text = input.value.trim();
      if (!text) return;
      input.value = '';

      chatHistories[currentChannel].push({ sender: 'user', time: '刚刚', text: text });
      renderMessages();

      setTimeout(() => {
        chatHistories[currentChannel].push({
          sender: currentChannel,
          name: currentChannel === 'assistant' ? 'Elena' : '专员',
          time: '刚刚',
          text: `收到老板指令！任务已由幕僚中枢登记并开始执行。`
        });
        renderMessages();
      }, 600);
    }

    function requestActiveAgentReport() {
      chatHistories[currentChannel].push({
        sender: currentChannel,
        name: '系统汇报',
        time: '刚刚',
        text: `【实时进度】工位运行正常，11大部门协同流水线畅通！`
      });
      renderMessages();
    }

    /* 启动自愈机制 */
    function bootSystem() {
      init3D();
      renderRoster();
      renderMessages();
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', bootSystem);
    } else {
      bootSystem();
    }
  </script>
</body>
</html>
